# Domain phrase -> {industry, topics}. Deterministic safety net for build_search_plan.
#
# The LLM interpret step is the PRIMARY route from natural language to structured
# criteria. This map is only a fallback: if the model leaves `industries` empty but
# the mandate clearly names a domain term, build_search_plan fills it in from here,
# and it seeds `topic_terms` for the FTS5 query.
#
# `industry: null` means the phrase is a topic with no industry of its own (it may be
# an exclusion target, e.g. "cybersecurity" — there is no Cybersecurity industry).
#
# Industry values MUST be one of the 10 in companies.json:
#   Fintech Energy Biotech Healthcare Telecom Technology Logistics Education Retail Automotive

phrases:
  # --- Fintech ---
  "fintech":              { industry: Fintech,    topics: [] }
  "financial technology": { industry: Fintech,    topics: [] }
  "fraud detection":      { industry: Fintech,    topics: ["fraud detection"] }
  "fraud prevention":     { industry: Fintech,    topics: ["fraud detection"] }
  "cybercrime":           { industry: Fintech,    topics: ["fraud detection"] }
  "financial crime":      { industry: Fintech,    topics: ["fraud detection"] }
  "banking analytics":    { industry: Fintech,    topics: ["banking analytics"] }
  "digital banking":      { industry: Fintech,    topics: ["digital banking"] }
  "payments":             { industry: Fintech,    topics: ["payments"] }
  "lending":              { industry: Fintech,    topics: ["lending"] }
  "risk assessment":      { industry: Fintech,    topics: ["risk assessment"] }
  "risk scoring":         { industry: Fintech,    topics: ["risk assessment"] }

  # --- Energy ---
  "energy sector":        { industry: Energy,     topics: [] }
  "energy":               { industry: Energy,     topics: [] }
  "energy forecasting":   { industry: Energy,     topics: ["energy forecasting", "forecasting"] }
  "renewable energy":     { industry: Energy,     topics: ["renewable energy"] }
  "smart grid":           { industry: Energy,     topics: ["smart grid"] }
  "grid optimization":    { industry: Energy,     topics: ["smart grid"] }

  # --- Biotech ---
  "biotech":              { industry: Biotech,    topics: [] }
  "biotechnology":        { industry: Biotech,    topics: [] }
  "drug discovery":       { industry: Biotech,    topics: ["drug discovery"] }
  "drug-discovery":       { industry: Biotech,    topics: ["drug discovery"] }
  "drug development":     { industry: Biotech,    topics: ["drug discovery"] }
  "gene editing":         { industry: Biotech,    topics: ["gene editing"] }
  "gene therapy":         { industry: Biotech,    topics: ["gene editing"] }
  "crispr":               { industry: Biotech,    topics: ["gene editing"] }
  "molecular analysis":   { industry: Biotech,    topics: ["molecular analysis"] }
  "precision medicine":   { industry: Biotech,    topics: ["drug discovery", "molecular analysis"] }
  "personalized medicine": { industry: Biotech,   topics: ["drug discovery", "molecular analysis"] }
  "cancer":               { industry: Biotech,    topics: ["drug discovery", "molecular analysis"] }
  "cancer research":      { industry: Biotech,    topics: ["drug discovery", "molecular analysis"] }
  "oncology":             { industry: Biotech,    topics: ["drug discovery", "molecular analysis"] }
  "immunotherapy":        { industry: Biotech,    topics: ["drug discovery", "molecular analysis"] }

  # --- Healthcare ---
  "healthcare":           { industry: Healthcare, topics: [] }
  "health care":          { industry: Healthcare, topics: [] }
  "diagnostics":          { industry: Healthcare, topics: ["diagnostics"] }
  "patient monitoring":   { industry: Healthcare, topics: ["patient monitoring"] }
  "health data":          { industry: Healthcare, topics: ["health data"] }

  # --- Telecom ---
  "telecom":              { industry: Telecom,    topics: [] }
  "telecommunications":   { industry: Telecom,    topics: [] }
  "network optimization": { industry: Telecom,    topics: ["network optimization"] }
  "5g analytics":         { industry: Telecom,    topics: ["5G analytics"] }
