# Scored evaluation set — 5 core queries covering the main capability dimensions
# (qualitative + structured criteria, mandatory vs preferred, exclusions + evidence,
# controlled revision, empty/conflicting handling) + 2 supplements (S1/S3).
#
# Methodology: development iterates against eval/dev_queries.yaml; this set is held
# back and run at the end, so RESULTS.md measures generalisation rather than fitting
# to these exact strings.
#
# Each `expected` block is a hand-authored "correct parse" oracle. Counts in the
# notes were verified against companies.json with `app.cli db`:
#   FI Fintech 580 (304 fraud/banking-analytics topic)
#   Nordic Energy 1898 (665 energy-forecasting topic)
#   DE Biotech 637 (219 drug-discovery; 53 of those founded > 2018;
#                   18 founded >= 2023; 9 founded >= 2024)
#   DE Energy 614 (193 smart-grid topic)
#   FI Fintech with employee_count > 5000 -> 0  (max employee_count in the data is 5000)
#
# `expected` schema:
#   mandatory / preferences: countries[] regions[] industries[]
#                            founded_year{gte,lte} employee_count{gte,lte}
#                            revenue_eur{gte,lte} capabilities_any[] capabilities_all[]
#                            serves[]
#   exclusions: { categories[], keywords[] }
#   should_revise:   bool   -- metadata.revision.performed must equal this
#   should_be_empty: bool   -- results == [] with a stated reason (a correct abstention)

Q1:
  query: >
    Find fintech companies in Finland working on fraud detection or banking analytics.
    Prefer companies founded after 2015 with fewer than 250 employees.
  expected:
    mandatory:
      countries: [Finland]
      industries: [Fintech]
      capabilities_any: ["fraud detection", "banking analytics"]
    preferences:
      founded_year: { gte: 2016 }
      employee_count: { lte: 249 }
    exclusions: {}
    should_revise: false
    should_be_empty: false
  notes: >
    Ranked list. founded_year and employee_count are ranking boosts, NOT filters —
    a 2014 / 400-employee company may still appear, ranked lower.
  judgment: >
    5 of 304 filter-matches meet every preference, and all 5 now reach the top of the list (the
    retrieve step runs a preference-boosted second search so they survive the bm25 cut). Ranks
    6-10 are pref 1/2, score 0.82, with the missed preference named.

Q2:
  query: >
    Find Nordic companies working on energy forecasting. Companies must operate in the
    energy sector. Prefer companies with 50-250 employees, but treat employee count as
    a preference rather than a mandatory requirement.
  expected:
    mandatory:
      regions: [Nordic]
      industries: [Energy]
      capabilities_any: ["energy forecasting"]
    preferences:
      employee_count: { gte: 50, lte: 250 }
    exclusions: {}
    should_revise: false
    should_be_empty: false
  notes: >
    Nordic = Finland, Norway, Sweden (no Denmark/Iceland in the data). The employee
    band must not filter.
  judgment: >
    The recall fix at work: 25 of 665 meet the 50-250 employee band, and all 10 returned are
    from that set (pref 2/2, score 1.00). The summary reports 25 and flags the returned 10 as an
    arbitrary slice of them.

Q3:
  query: >
    Find companies that directly provide fraud-detection technology to European banks.
    Exclude general cybersecurity consultancies and explain the evidence that each
    selected company serves financial institutions.
  expected:
    mandatory:
      industries: [Fintech]
      capabilities_any: ["fraud detection"]
      serves: ["European banks"]
    preferences:
      regions: [Europe]
    exclusions:
      keywords: ["general cybersecurity consultancies"]
    should_revise: false
    should_be_empty: false
  notes: >
    "European" describes the CUSTOMERS ("European banks"), not the company — it is
    NOT a mandatory location filter. It becomes a location *preference*
    (deterministically, from the `serves` phrase). "fraud-detection technology" ->
    industry Fintech (recall-safe) + capability "fraud detection". "serves European
    banks" IS mandatory, but this dataset has no customer field, so it is
    unverifiable: every returned row lands at mand 3/4, never a full match, with a
    caveat. The exclusion ("cybersecurity consultancies") matches NOTHING — there is
    no Cybersecurity industry — and must be reported as such.
  judgment: >
    No mandatory country filter (correct — the mandate never says where the company is).
    Europe is a location preference, so European fraud-detection Fintechs rank first. Every
    row is mand 3/4: industry + capability met, 'serves European banks' unverifiable and
    labelled an inference + caveat. Exclusion matches nothing (correctly).

Q4:
  query: >
    Identify German drug-discovery companies, preferably founded after 2018. If fewer
    than three strong matches exist, broaden the founding-year preference, but do not
    broaden the country or drug-discovery requirements.
  expected:
    mandatory:
      countries: [Germany]
      industries: [Biotech]
      capabilities_any: ["drug discovery"]
    preferences:
      founded_year: { gte: 2019 }
    exclusions: {}
    should_revise: false
    should_be_empty: false
  notes: >
    53 German Biotech "drug discovery" companies founded > 2018 — well over the
    3-match threshold, so revision should NOT trigger. The revision rule is
    deterministic (relax_preferences), not an LLM call.
  judgment: >
    219 German Biotech drug-discovery firms, no revision. 'founded after 2018' is a preference:
    the preference-boosted retrieval surfaces founded>=2019 firms (pref 1/1, score 1.00) above
    older ones (pref 0/1, score 0.65).

Q5:
  query: >
    Find Finnish fintech companies founded after 2022 with more than 5,000 employees
    and revenue below EUR 10 million.
  expected:
    mandatory:
      countries: [Finland]
      industries: [Fintech]
      founded_year: { gte: 2023 }
      employee_count: { gte: 5001 }
      revenue_eur: { lte: 10000000 }
    preferences: {}
    exclusions: {}
    should_revise: false
    should_be_empty: true
  notes: >
    Infeasible: max employee_count in the data is 5000. check_feasibility must
    short-circuit to an empty result + reason after the interpret call only — no
    validation LLM call. A correct abstention scores as PASS.
  judgment: >
    Correct abstention. employee_count max in the data is 5000, so >5000 is impossible;
    feasibility short-circuits after the interpret call only (1 LLM call).

# --- supplements: paths the 5 core queries do not exercise on this dataset ---

S1:
  query: >
    Find German biotech companies working on gene editing, founded after 2020.
  expected:
    mandatory:
      countries: [Germany]
      industries: [Biotech]
      capabilities_any: ["gene editing"]
      founded_year: { gte: 2021 }
    preferences: {}
    exclusions: {}
    should_revise: false
    should_be_empty: false
  notes: >
    REVISION IS DATA-LIMITED and cannot be forced honestly from a query string on
    this dataset: the templated descriptions make "drug discovery" / "gene editing"
    almost always verifiable, so the validated set rarely falls below the
    min_results threshold, so `relax_preferences` does not trigger. The revision
    ladder is instead proven by a unit test (`test_workflow.test_revision_path_runs_once`,
    which scripts an empty first validation pass). This query is kept as a tight
    real-data filter (few GE Biotech founded >= 2024 with < 50 staff) that should
    still return a small non-empty list without padding.
  judgment: >
    Tight real filter (German Biotech gene-editing founded >=2021, 22 rows). No preferences, so
    all 22 sit in one tier -> the 10 returned are flagged an arbitrary slice. mand 4/4
    (location, industry, founded>=2021, gene-editing).

S3:
  query: >
    Find energy companies in Germany, but exclude anything working on smart grid.
  expected:
    mandatory:
      countries: [Germany]
      industries: [Energy]
    preferences: {}
    exclusions:
      keywords: ["smart grid"]
    should_revise: false
    should_be_empty: false
  notes: >
    614 German Energy companies; 193 mention "smart grid" and must be removed. Unlike
    Q3's vacuous exclusion, this one actually drops candidates — the response should
    report how many.
  judgment: >
    Non-vacuous exclusion: 421 of 614 German Energy firms remain after removing 'smart grid'.
    Purely structural + keyword exclusion -> LLM validation skipped (1 LLM call total). mand 3/3
    (location, industry, not-smart-grid).
