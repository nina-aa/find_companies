# Render.com config reference.
#
# NOTE: deploying via "New -> Blueprint" makes Render ask for a card (a blueprint
# *could* provision paid resources). To deploy WITHOUT a card, create the service
# by hand: New -> Web Service -> connect the repo -> Runtime: Docker -> Free.
# Then set OPENAI_API_KEY and AGENT_API_KEY under Environment. This file just
# documents the same settings.
#
# No `disk:` block and no database -> nothing here provisions paid resources.
# The SQLite index is baked into the image at build time, so no persistent
# storage is needed. Free tier spins down after ~15 min idle (~30-60 s cold
# start); idle RAM ~40 MB against the 512 MB limit.
services:
  - type: web
    name: agentic-company-search
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY      # set in the Render dashboard (Environment)
        sync: false
      - key: AGENT_API_KEY       # set in the Render dashboard; give this to evaluators
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: AGENT_DEADLINE_S
        value: "90"
      - key: LOG_LEVEL
        value: INFO
